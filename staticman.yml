allowedFields: 
  - name
  - email
  - message
branch: main
commitMessage: "New comment in {options.slug}"
filename: "comment-{@timestamp}"
format: yaml
generatedFields:
  date:
    options:
      format: iso8601
    type: date
moderation: false
akismet:
  enabled: true
  author: name
  authorEmail: email
  content: message
path: "_data/comments/{options.slug}"
requiredFields: 
  - name
  - email
  - message
transforms: 
  email: md5